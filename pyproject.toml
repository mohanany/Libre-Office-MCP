[project]
name = "libreoffice-mcp"
version = "0.1.0"
description = "Native MCP servers for LibreOffice applications (Writer, Calc, Impress, Draw) over UNO"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.10,<2.0",
]

[project.scripts]
libreoffice-mcp = "lo_mcp.__main__:main"
libreoffice-mcp-writer = "lo_mcp.perapp:writer"
libreoffice-mcp-calc = "lo_mcp.perapp:calc"
libreoffice-mcp-impress = "lo_mcp.perapp:impress"
libreoffice-mcp-draw = "lo_mcp.perapp:draw"
libreoffice-mcp-base = "lo_mcp.perapp:base"
libreoffice-mcp-math = "lo_mcp.perapp:math"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lo_mcp*"]
